[package]
name = "meshwork-demo-notes-sync"
version = "0.1.0"
edition = "2021"
description = "Document replication for apps that sync documents between devices."
publish = false

[lib]
name = "notesync"

# Full debug info for the crate and every dependency is what grows target/
# into the gigabytes; line tables keep backtraces readable.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false
